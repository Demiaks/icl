# Sustituye a los crons de alta frecuencia que el plan Hobby de Vercel no permite.
# Secrets del repo necesarios: APP_URL (https://tu-dominio.com) y CRON_SECRET.
name: crons
on:
  schedule:
    - cron: "*/5 * * * *"    # workflow-tick, outbound-scheduled-sends, event-agent-scheduled-sends
    - cron: "*/15 * * * *"   # schedule-agents
    - cron: "0 */6 * * *"    # automations
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a los endpoints según el horario
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          call() {
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/$1")
            echo "$1 -> $code"
            [ "$code" = "200" ] || exit 1
          }
          case "$SCHEDULE" in
            "*/5 * * * *")
              call workflow-tick
              call outbound-scheduled-sends
              call event-agent-scheduled-sends ;;
            "*/15 * * * *")
              call schedule-agents ;;
            "0 */6 * * *")
              call automations ;;
            *)
              call workflow-tick ;;
          esac
